<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>OD Booker</title>

  <!-- STYLES -->
  <link rel="stylesheet" href="style.css" />

  <!-- FONTS -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <!-- ICONS -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
  />
</head>

<body>

  <!-- 🔥 HEADER -->
  <div class="od-header">
    <h2>OD Booker</h2>

    <!-- 🖨️ PRINT BUTTON WITH ICON -->
    <button id="print-btn" class="print-btn">
      <i class="fas fa-print"></i>
    </button>
  </div>

  <!-- CALENDAR -->
  <div class="container">
    <div class="calendar">

      <div class="header">
        <div class="month"></div>

        <div class="btns">
          <div class="btn today-btn">
            <i class="fas fa-calendar-day"></i>
          </div>

          <div class="btn prev-btn">
            <i class="fas fa-chevron-left"></i>
          </div>

          <div class="btn next-btn">
            <i class="fas fa-chevron-right"></i>
          </div>
        </div>
      </div>

      <!-- WEEK DAYS -->
      <div class="weekdays">
        <div class="day">Sun</div>
        <div class="day">Mon</div>
        <div class="day">Tue</div>
        <div class="day">Wed</div>
        <div class="day">Thu</div>
        <div class="day">Fri</div>
        <div class="day">Sat</div>
      </div>

      <!-- DAYS -->
      <div class="days"></div>

    </div>
  </div>

  <!-- POPUP -->
  <div class="popup" id="popup">
    <div class="popup-content">
      <span class="close-btn">&times;</span>

      <h3 id="selected-date">Selected Date</h3>

      <!-- LIST -->
      <div id="popup-list"></div>

      <!-- INPUTS -->
      <input type="text" id="name-input" placeholder="Enter name" />
      <input type="text" id="event-input" placeholder="Enter event" />

      <button id="save-btn">Save</button>
    </div>
  </div>

  <!-- CREDITS -->
  <div class="credits">
    <a href="https://www.linkedin.com/in/ashwinsenthil" target="_blank" rel="noopener noreferrer">
      Created by 
      <img src="logo.png" alt="Ashwin Logo" class="credit-logo">
      Ashwin S
    </a>
  </div>

  <!-- SCRIPT -->
  <script src="script.js"></script>

</body>
</html>
