<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>OD Booker</title>

  <!-- STYLES -->
  <link rel="stylesheet" href="style.css" />

  <!-- FONTS -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <!-- ICONS -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
  />
</head>

<body>

  <!-- 🔥 HEADER -->
  <div class="od-header">
    <h2>OD Booker</h2>

    <!-- 🖨️ PRINT DROPDOWN CONTAINER -->
    <div class="print-wrapper">
      <button id="print-btn" class="print-btn">
        <i class="fas fa-print"></i>
      </button>

      <!-- DROPDOWN MENU -->
      <div id="print-dropdown" class="print-dropdown">
        <h4><i class="fas fa-file-pdf"></i> Export Report</h4>
        
        <div class="dd-group">
          <label>Filter By:</label>
          <select id="print-filter-select">
            <option value="date">Specific Date</option>
            <option value="name">Name + Date Range</option>
            <option value="monthly">Monthly Report</option>
          </select>
        </div>

        <div id="print-date-inputs" class="dd-inputs">
          <input type="date" id="print-single-date" />
        </div>

        <div id="print-name-inputs" class="dd-inputs" style="display: none;">
          <input type="text" id="print-name" placeholder="Enter name" />
          <div class="dd-date-row">
            <input type="date" id="print-date-from" title="From Date" />
            <input type="date" id="print-date-to" title="To Date" />
          </div>
        </div>

        <div id="print-monthly-inputs" class="dd-inputs" style="display: none;">
          <input type="month" id="print-month" />
        </div>

        <button id="generate-pdf-btn" class="dd-generate-btn">
          <i class="fas fa-download"></i> Generate PDF
        </button>
      </div>
    </div>
  </div>

  <!-- CALENDAR -->
  <div class="container">
    <div class="calendar">

      <div class="header">
        <div class="month"></div>

        <div class="btns">
          <div class="btn today-btn">
            <i class="fas fa-calendar-day"></i>
          </div>

          <div class="btn prev-btn">
            <i class="fas fa-chevron-left"></i>
          </div>

          <div class="btn next-btn">
            <i class="fas fa-chevron-right"></i>
          </div>
        </div>
      </div>

      <!-- WEEK DAYS -->
      <div class="weekdays">
        <div class="day">Sun</div>
        <div class="day">Mon</div>
        <div class="day">Tue</div>
        <div class="day">Wed</div>
        <div class="day">Thu</div>
        <div class="day">Fri</div>
        <div class="day">Sat</div>
      </div>

      <!-- DAYS -->
      <div class="days"></div>

    </div>
  </div>

  <!-- POPUP -->
  <div class="popup" id="popup">
    <div class="popup-content">
      <span class="close-btn">&times;</span>

      <h3 id="selected-date">Selected Date</h3>

      <!-- LIST -->
      <div id="popup-list"></div>

      <!-- INPUTS -->
      <input type="text" id="name-input" placeholder="Enter name" />
      <input type="tel" id="reg-no-input" placeholder="Enter Register No" inputmode="numeric" pattern="[0-9]{11}" maxlength="11" />
      <input type="text" id="event-input" placeholder="Enter event with college name if outside" />

      <button id="save-btn">Save</button>

      <!-- EMAIL REQUEST — shown when date is fully booked -->
      <div id="email-request-section" style="display:none;">
        <div class="full-notice">
          <span class="full-icon">⚠️</span>
          <strong>This date is fully booked!</strong>
        </div>
        <p class="full-sub">Fill in your details above, then tap an email below to send your OD request:</p>
        <a id="email-btn-1" class="email-link-btn" href="#" target="_blank" rel="noopener">
          <i class="fas fa-envelope"></i> 25cb049@drngpit.ac.in
        </a>
        <p class="email-or">or</p>
        <a id="email-btn-2" class="email-link-btn" href="#" target="_blank" rel="noopener">
          <i class="fas fa-envelope"></i> 25cb004@drngpit.ac.in
        </a>
      </div>

    </div>
  </div>

  <!-- CREDITS -->
  <div class="credits">
    <a href="https://www.linkedin.com/in/ashwinsenthil" target="_blank" rel="noopener noreferrer">
      Powered by 
      <img src="logo.png" alt="Ashwin Logo" class="credit-logo">
    </a>
  </div>

  <!-- SCRIPT -->
  <script src="script.js"></script>

</body>
</html>
